<!DOCTYPE html><html lang="en"><head><title>Manager dashboard | Fixline</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="manager"><header class="top" id="nav"></header>
<main class="wrap"><div id="auth"></div><div id="app" hidden><h1>Manager dashboard</h1>
<div class="chips" role="group" aria-label="Section"><button type="button" id="t1" aria-pressed="true">Issues</button><button type="button" id="t2" aria-pressed="false">Staff accounts</button></div>
<div id="issues"><div class="stats" id="stats"></div><p class="box" id="rec"></p>
<div class="scroll"><table><thead><tr><th>Issue</th><th>Status</th><th>Owner</th><th>Expected fix</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<p style="margin-top:1rem"><button class="btn ghost" id="reset" type="button">Reset demo issues</button></p></div>
<div id="staffTab" hidden><h2>Staff accounts</h2><p>Staff cannot register themselves. Create their login here, then assign them issues.</p>
<form id="sf" class="box"><p class="box warn" id="sm" role="alert" hidden></p><div class="two"><div><label for="sn">Name (and trade)</label><input type="text" id="sn" required placeholder="e.g. Ramesh (plumber)"></div><div><label for="se">Email</label><input type="email" id="se" required></div></div>
<label for="sp">Starting password (at least 6 characters)</label><input type="text" id="sp" required minlength="6" style="max-width:320px"><p style="margin-top:1rem"><button class="btn" type="submit">Create staff account</button></p></form>
<div class="scroll"><table style="min-width:480px"><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody id="staffRows"></tbody></table></div></div></div></main>
<footer class="wrap" id="foot"></footer><script src="app.js"></script></body></html>
